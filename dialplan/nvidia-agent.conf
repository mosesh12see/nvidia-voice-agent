; NVIDIA Voice Agent dialplan
; Drop this file on 157.230.13.249 at: /etc/asterisk/includes/nvidia-agent.conf
; Then add this line to /etc/asterisk/extensions.conf (or extensions_custom.conf):
;   #include "includes/nvidia-agent.conf"
;
; SAFE: This is an isolated context. It does NOT touch solar-exits, solexes,
; cap-energy, schaper, california, dennis, jaxson, or any existing campaign.
;
; To test: dial extension 8400 from any internal SIP phone.
; To use in a campaign: set transfer target to 8400 or dial _8400. from outbound.

[nvidia-agent]

; Entry point — accepts any subextension for campaign routing
; 8400 = template campaign
; 8401 = (add more campaigns here)
exten => 8400,1,NoOp(NVIDIA Agent - template campaign)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,AGI(/opt/nvidia-voice-agent/agi/nvidia_agent.agi,template)
 same => n,GotoIf($["${NVIDIA_ROOM_NAME}" = ""]?hangup)
 ; Daily.co SIP interconnect: sip:<room-name>@sip.daily.co
 same => n,Set(DAILY_SIP=${NVIDIA_ROOM_NAME}@sip.daily.co)
 same => n,NoOp(Bridging to Daily room: ${DAILY_SIP})
 same => n,Dial(PJSIP/${DAILY_SIP},300,gU(nvidia-agent-cleanup))
 same => n(hangup),Hangup()

; Cleanup subroutine — tells launcher to stop the agent process
exten => nvidia-agent-cleanup,1,NoOp(Cleaning up NVIDIA agent call ${NVIDIA_CALL_ID})
 same => n,System(curl -s -X POST http://127.0.0.1:4579/stop-call -H "Content-Type: application/json" -d '{"call_id":"${NVIDIA_CALL_ID}"}')
 same => n,Return()
